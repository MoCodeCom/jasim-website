name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A project site lives under /<repository>/. Set the BASE_HREF repository variable to /
      # when using a custom domain.
      - run: npx ng build --base-href "${{ vars.BASE_HREF || format('/{0}/', github.event.repository.name) }}"
      - run: cp dist/jasim-website/browser/index.csr.html dist/jasim-website/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jasim-website/browser
      - id: deployment
        uses: actions/deploy-pages@v4
